<header id="siteHeader">
  <nav aria-label="Main">
    {% assign navItems = "about,teachers,lessons,resources,shop" | split: "," %}
    <div>
      <a href="index.html" aria-label="Kreutzer — home">
        <img desktop src="assets/Kreutzer-源文件2修改颜色-.svg" alt="Kreutzer">
        <img mobile src="assets/Kreutzer-Logo-Only.svg" alt="Kreutzer">
      </a>
      <ul role="list">
        {% for item in navItems %}
        <li><a href="{{ item }}.html" class="draw-underline{% if page.fileSlug == item %} active{% endif %}"{% if page.fileSlug == item %} aria-current="page"{% endif %}>{{ item }}</a></li>
        {% endfor %}
      </ul>
    </div>
    <nav-logo-main aria-hidden="true">Kreutzer</nav-logo-main>
    <a href="contact.html" class="btn btn-clear btn-slide">Book a trial</a>

    <!-- Mobile Section -->
    <button class="burger-btn" id="burgerBtn" aria-label="Toggle menu" aria-expanded="false" aria-controls="sidebar">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>

    <div class="overlay" id="overlay"></div>
    <aside id="sidebar" aria-label="Mobile menu">
      <span sidebar-mark>Kreutzer</span>
      <ul role="list">
        <li><a href="index.html" class="draw-underline{% if page.fileSlug == '' %} active{% endif %}">home</a></li>
        {% for item in navItems %}
        <li><a href="{{ item }}.html" class="draw-underline{% if page.fileSlug == item %} active{% endif %}"{% if page.fileSlug == item %} aria-current="page"{% endif %}>{{ item }}</a></li>
        {% endfor %}
        <li><a href="contact.html" class="draw-underline{% if page.fileSlug == 'contact' %} active{% endif %}">contact</a></li>
      </ul>
      <a href="contact.html" class="btn">Book a free trial</a>
    </aside>
  </nav>
</header>
