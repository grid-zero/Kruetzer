<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8">
    <script>
      document.documentElement.classList.add('js');
      /* The piano loader plays once per browser session; index.js sets this flag. */
      try { if (sessionStorage.getItem('kreutzer-intro')) document.documentElement.classList.add('no-loader'); } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="{{ description }}">
    <meta name="theme-color" content="#0b0c10">
    <title>{{ title }}</title>
    <link rel="icon" type="image/svg+xml" href="assets/Kreutzer-Icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Montserrat:ital,wght@0,300..600;1,300..500&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    {% if loader %}{% include "loader.html" %}{% endif %}
    {% include "header.html" %}
    <main id="main">
      {{ content }}
    </main>
    {% include "footer.html" %}
    <script src="index.js" defer></script>
  </body>
</html>
