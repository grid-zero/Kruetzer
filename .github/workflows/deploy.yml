name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/website-style-overhaul-ee15eb]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: live }
      - uses: actions/checkout@v4
        with: { ref: claude/website-style-overhaul-ee15eb, path: preview }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Build current site (main)
        working-directory: live
        run: npm ci && npm run build
      - name: Build redesign
        working-directory: preview
        run: npm ci && npm run build

      - name: Combine into one site
        run: |
          mkdir -p site/preview
          cp -r live/_site/. site/
          cp -r preview/_site/. site/preview/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4